apiVersion: offense.dev/raid/v1alpha1
kind: PolicyBundle
metadata:
  name: ci-agent
  revision: 1
defaults:
  effect: deny
rules:
  # --- Guardrail: deny outright -------------------------------------------
  - id: deny-catastrophic
    description: >-
      Irreversible, system-wide, or credential-exfiltrating commands are
      blocked outright.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - filesystem.read
        - network.fetch
        - shell.delete
        - shell.execute
        - shell.write
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - db.mutate
        - cloud.mutate
    when: >-
      (has(resource.attributes.destructive) && resource.attributes.destructive == "true") ||
      (has(resource.attributes.exfil) && resource.attributes.exfil == "true")
    effect: deny

  # --- Egress & exfiltration ------------------------------------------------
  # A pipeline has no human to ask, so anything that would be "confirm" for a
  # solo engineer is a flat deny here: sending credentials out, or egressing
  # from a build that has already handled them.
  - id: deny-secret-egress
    description: >-
      Sending credential material off the machine, whether the key was read in
      this command or earlier in the session.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - shell.write
        - shell.execute
        - shell.delete
        - filesystem.read
        - filesystem.write
        - network.fetch
        - package.install
        - git.push
    when: >-
      has(resource.attributes.outbound_secret) &&
      resource.attributes.outbound_secret == "true"
    effect: deny

  - id: deny-tainted-egress
    description: Egress from a build that has already handled credential material.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - shell.write
        - shell.execute
        - filesystem.read
        - filesystem.write
        - network.fetch
    when: >-
      has(resource.attributes.tainted_egress) &&
      resource.attributes.tainted_egress == "true"
    effect: deny

  # --- Intermediary / router integrity (arXiv:2604.08407) -------------------
  # A pipeline has no human to ask, so every intermediary concern is a flat
  # deny: a call the model never declared, an install reached through an
  # untrusted router (the paper's AC-1.a typosquat), and any consequential step
  # governed by a response that cannot be tied to the provider.
  - id: deny-injected-call
    description: >-
      A tool call matching no call the model declared for this turn, or whose
      arguments changed between the provider's response and dispatch.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - filesystem.read
        - network.fetch
        - shell.delete
        - shell.execute
        - shell.write
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - db.mutate
        - cloud.mutate
    when: >-
      (has(resource.attributes.injected_call) && resource.attributes.injected_call == "true") ||
      (has(resource.attributes.tool_args_unverified) && resource.attributes.tool_args_unverified == "true")
    effect: deny

  - id: deny-router-package-install
    description: >-
      Installing a package from a response that came through an untrusted
      router.
    match:
      providers: [claude-code]
      operations: [package.install]
    when: >-
      has(resource.attributes.router_untrusted) &&
      resource.attributes.router_untrusted == "true"
    effect: deny

  - id: deny-unverified-provenance
    description: >-
      A consequential step governed by a response the client could not tie to
      the provider and model it asked for.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - shell.execute
        - shell.delete
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - package.install
        - service.exec
        - container.exec
        - db.mutate
        - cloud.mutate
    when: >-
      (has(resource.attributes.intermediary) && resource.attributes.intermediary == "true") ||
      (has(resource.attributes.model_mismatch) && resource.attributes.model_mismatch == "true") ||
      (has(resource.attributes.sequence_anomaly) && resource.attributes.sequence_anomaly == "true")
    effect: deny

  # --- Indirect prompt injection --------------------------------------------
  # A state-changing step taken after the build pulled in outside content.
  # Normal build traffic does not trip this: only the agent's own fetch/search
  # tools mark a session as having read untrusted input.
  - id: confirm-untrusted-source
    description: >-
      A state-changing action taken after the session read untrusted external
      content.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - shell.execute
        - shell.delete
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - package.install
        - service.exec
        - container.exec
        - db.mutate
        - cloud.mutate
    when: >-
      has(resource.attributes.untrusted_source) &&
      resource.attributes.untrusted_source == "true"
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  - id: allow-reads
    description: Read-only file access, inspection, and fetches.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - filesystem.read
        - network.fetch
    effect: allow

  - id: allow-build-and-test
    description: Build, test, and shell execution outside production.
    match:
      providers: [claude-code]
      operations:
        - shell.execute
        - shell.write
        - filesystem.write
        - package.install
    when: >-
      resource.environment != "production"
    effect: allow

  - id: confirm-prod-writes
    description: Writes, installs, and execution in production.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - filesystem.write
        - package.install
        - shell.execute
    when: >-
      resource.environment == "production"
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  - id: confirm-force-push
    description: Rewriting history always needs a human.
    match:
      providers: [claude-code]
      operations:
        - git.force_push
        - git.rewrite
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  - id: confirm-delete-db-cloud
    description: Deletes, database mutation, and cloud mutation.
    match:
      providers: [claude-code]
      operations:
        - shell.delete
        - db.mutate
        - cloud.mutate
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: operation

  - id: deny-listed
    description: Operations that must never run.
    match:
      providers: [claude-code]
      operations: [shell.denied]
    effect: deny
