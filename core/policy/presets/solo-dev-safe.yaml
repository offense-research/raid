apiVersion: offense.dev/raid/v1alpha1
kind: PolicyBundle
metadata:
  name: solo-dev-safe
  revision: 1
defaults:
  effect: deny
rules:
  # --- Guardrail: deny outright, never merely approve -----------------------
  # A solo engineer has no second reviewer. The highest-value protection is
  # blocking the agent's irreversible actions before they happen; the agent is
  # told why and reroutes. Nothing here is approvable.
  - id: deny-catastrophic
    description: >-
      Irreversible, system-wide, credential-exfiltrating, or protected-branch
      rewriting commands are blocked outright.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - filesystem.read
        - network.fetch
        - shell.delete
        - shell.execute
        - shell.write
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - db.mutate
        - cloud.mutate
    when: >-
      (has(resource.attributes.destructive) && resource.attributes.destructive == "true") ||
      (has(resource.attributes.exfil) && resource.attributes.exfil == "true") ||
      (has(resource.attributes.protected_branch) && resource.attributes.protected_branch == "true" &&
        (action.operation == "git.force_push" || action.operation == "git.rewrite"))
    effect: deny

  # --- Intermediary / router integrity (arXiv:2604.08407) -------------------
  # The client sits behind a chain of routers; every hop terminates and
  # re-originates TLS, so every hop sees each in-flight tool call. Nothing in
  # the deployed stack binds the arguments the provider returned to the
  # arguments the client finally executes, so a single hop can inject a call
  # the model never made (AC-1) or rewrite one it did (AC-1.a). Neither is
  # approvable: there is no reading of "run this call the model never asked
  # for" that one keystroke should wave through.
  - id: deny-injected-call
    description: >-
      A tool call matching no call the model declared for this turn, or whose
      arguments changed between the provider's response and dispatch.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - filesystem.read
        - network.fetch
        - shell.delete
        - shell.execute
        - shell.write
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - db.mutate
        - cloud.mutate
    when: >-
      (has(resource.attributes.injected_call) && resource.attributes.injected_call == "true") ||
      (has(resource.attributes.tool_args_unverified) && resource.attributes.tool_args_unverified == "true")
    effect: deny

  # A typosquat on a dependency name is the paper's AC-1.a: rewrite the package
  # in an install so the client fetches the attacker's package. An install
  # whose response arrived through an untrusted router is blocked outright,
  # because a domain allowlist cannot see the substitution.
  - id: deny-router-package-install
    description: >-
      Installing a package from a response that came through an untrusted
      router.
    match:
      providers: [claude-code]
      operations: [package.install]
    when: >-
      has(resource.attributes.router_untrusted) &&
      resource.attributes.router_untrusted == "true"
    effect: deny

  # --- Egress & exfiltration ------------------------------------------------
  # The tier above catches a credential *path* paired with a network verb in a
  # single command. These catch what no single command can express on its own.
  #
  # A recognised credential value on its way out is not approvable: there is no
  # reading of "send this API key to that host" that one keystroke should wave
  # through.
  - id: deny-secret-egress
    description: >-
      Sending credential material off the machine, whether the key was read in
      this command or earlier in the session.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - shell.write
        - shell.execute
        - shell.delete
        - filesystem.read
        - filesystem.write
        - network.fetch
        - package.install
        - git.push
    when: >-
      has(resource.attributes.outbound_secret) &&
      resource.attributes.outbound_secret == "true"
    effect: deny

  # A credential was handled earlier in this session and now something is going
  # out. Usually innocent, occasionally the whole attack - so ask, and bind the
  # approval to this exact request.
  - id: confirm-tainted-egress
    description: Egress from a session that has already handled credential material.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - shell.write
        - shell.execute
        - filesystem.read
        - filesystem.write
        - network.fetch
    when: >-
      has(resource.attributes.tainted_egress) &&
      resource.attributes.tainted_egress == "true"
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  # --- Indirect prompt injection --------------------------------------------
  # Once the session has pulled in outside content, a privileged action is
  # exactly what an injected instruction would be driving at. The judgement is
  # deterministic and never depends on reading the content itself.
  - id: confirm-untrusted-source
    description: >-
      A state-changing action taken after the session read untrusted external
      content.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - shell.execute
        - shell.delete
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - package.install
        - service.exec
        - container.exec
        - db.mutate
        - cloud.mutate
    when: >-
      has(resource.attributes.untrusted_source) &&
      resource.attributes.untrusted_source == "true"
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  # --- Intermediary suspicion: stop for a human ----------------------------
  # A response that cannot be tied to the provider, or that arrived through a
  # recognised router, taints every call it governs; the action itself may be
  # ordinary, so it is the response that needs a human.
  - id: confirm-untrusted-router
    description: >-
      A consequential action whose model response came through a router that is
      not the provider's own endpoint.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - shell.execute
        - shell.delete
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - package.install
        - service.exec
        - container.exec
        - db.mutate
        - cloud.mutate
    when: >-
      has(resource.attributes.router_untrusted) &&
      resource.attributes.router_untrusted == "true"
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  - id: confirm-unverified-provenance
    description: >-
      A consequential action governed by a response the client could not tie to
      the provider and model it asked for.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - shell.execute
        - shell.delete
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - package.install
        - service.exec
        - container.exec
        - db.mutate
        - cloud.mutate
    when: >-
      (has(resource.attributes.intermediary) && resource.attributes.intermediary == "true") ||
      (has(resource.attributes.model_mismatch) && resource.attributes.model_mismatch == "true")
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  - id: confirm-sequence-anomaly
    description: >-
      A call that arrived out of the order the model declared for this turn.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - shell.execute
        - shell.delete
        - filesystem.write
        - git.push
        - git.force_push
        - git.rewrite
        - package.install
        - service.exec
        - container.exec
        - db.mutate
        - cloud.mutate
    when: >-
      has(resource.attributes.sequence_anomaly) &&
      resource.attributes.sequence_anomaly == "true"
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  # --- Reads are always fine ----------------------------------------------
  - id: allow-reads
    description: Read-only file access and safe shell inspection.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - filesystem.read
        - network.fetch
    effect: allow

  # --- Normal development work --------------------------------------------
  - id: allow-dev-writes
    description: File edits and package installs outside production.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - filesystem.write
        - package.install
    when: >-
      resource.environment != "production"
    effect: allow

  # Pushing your own feature branch is routine.
  - id: allow-dev-push
    description: Pushing a non-protected branch.
    match:
      providers: [claude-code]
      operations: [git.push]
    when: >-
      resource.environment != "production" &&
      (!has(resource.attributes.protected_branch) || resource.attributes.protected_branch != "true")
    effect: allow

  # --- One-keypress confirmations -----------------------------------------
  # Scoped to the operation so a repetitive, low-risk action is not
  # re-approved for every invocation; the destructive tiers stay exact.
  - id: confirm-delete-db-cloud
    description: Deletes, database mutation, and cloud mutation.
    match:
      providers: [claude-code]
      operations:
        - shell.delete
        - db.mutate
        - cloud.mutate
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: operation

  - id: confirm-exec
    description: Running services, containers, or privileged shell commands.
    match:
      providers: [claude-code]
      operations:
        - service.exec
        - container.exec
        - shell.execute
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: operation

  - id: confirm-force-push
    description: Force-pushing or rewriting history always needs a human.
    match:
      providers: [claude-code]
      operations:
        - git.force_push
        - git.rewrite
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  - id: confirm-protected-push
    description: Pushing to a protected branch needs a human.
    match:
      providers: [claude-code]
      operations:
        - git.push
    when: >-
      has(resource.attributes.protected_branch) &&
      resource.attributes.protected_branch == "true"
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  - id: confirm-prod-writes
    description: File writes or package installs in production.
    match:
      providers: [claude-code]
      operations:
        - shell.write
        - filesystem.write
        - package.install
    when: >-
      resource.environment == "production"
    effect: require_approval
    approval:
      approver_groups: []
      quorum: 1
      ttl: 5m
      allow_scope: exact_request

  # --- Never ---------------------------------------------------------------
  - id: deny-listed
    description: Operations that must never run.
    match:
      providers: [claude-code]
      operations: [shell.denied]
    effect: deny
