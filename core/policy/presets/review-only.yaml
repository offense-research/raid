apiVersion: offense.dev/raid/v1alpha1
kind: PolicyBundle
metadata:
  name: review-only
  revision: 1
defaults:
  effect: deny
rules:
  # A read-only agent: it may inspect the world but never change it. Useful
  # when reviewing a codebase, triaging, or pairing with a human driver.
  #
  # Reading is allowed and fetching is allowed, but not fetching a secret: the
  # one thing a review pass must never do is carry a credential out with it.
  - id: deny-secret-egress
    description: >-
      Sending credential material off the machine while reviewing.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - filesystem.read
        - network.fetch
    when: >-
      has(resource.attributes.outbound_secret) &&
      resource.attributes.outbound_secret == "true"
    effect: deny

  - id: allow-reads
    description: Read-only file access, inspection, and fetches.
    match:
      providers: [claude-code]
      operations:
        - shell.read
        - shell.inspect
        - filesystem.read
        - network.fetch
    effect: allow

  - id: deny-all-mutation
    description: This preset grants no write, delete, execute, or admin authority.
    match:
      providers: [claude-code]
      effects: [write, delete, execute, admin]
    effect: deny
