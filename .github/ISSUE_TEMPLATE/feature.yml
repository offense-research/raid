name: Feature request
description: Suggest a capability, policy feature, or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Raid does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Policy language, flag, endpoint, adapter?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - policy language / CEL
        - approvals / receipts
        - CLI / TUI
        - coding-agent integration
        - daemon / deployment
        - docs
        - other
    validations:
      required: true
