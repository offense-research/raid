name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Build
        run: |
          go build -o raid .
          ln -sf raid raidd
          ./raid version

      - name: Unit + integration tests
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./core/canonical ./core/policy ./core/decision ./core/store ./core/approval ./core/api ./core/jev ./core/nlpolicy ./core/tui ./core/cli ./pkg/raidclient

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Provisioning smoke (fresh deploy + demo)
        run: |
          RAID_PREFIX="$RUNNER_TEMP/raid" sh tools/raid-provision.sh >/dev/null 2>&1 \
            || { cat "$RUNNER_TEMP/raid/raidd.log"; exit 1; }
          export RAID_SOCKET="$RUNNER_TEMP/raid/raid.sock"
          ./raid doctor

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - name: Benchmark suite
        run: go test -bench=Benchmark -benchmem -v ./core/bench